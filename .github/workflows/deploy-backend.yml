name: Deploy API

# Builds the API image, pushes it to Artifact Registry and deploys it to Cloud
# Run after CI passes. Authentication is keyless (Workload Identity Federation):
# only this repository's main branch can impersonate the deployer account.
# Secrets live in Secret Manager and are kept by the service across deploys.
#
# Schema changes: run this workflow manually with "run_migrations" checked. The
# new revision then starts without traffic, migrates at startup, and only then
# receives traffic.

on:
  push:
    branches: [main]
    paths:
      - backend/**
      - Dockerfile
      - .dockerignore
      - .github/workflows/deploy-backend.yml
  workflow_dispatch:
    inputs:
      run_migrations:
        description: Run database migrations (new revision starts without traffic first)
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-api
  cancel-in-progress: false

env:
  PROJECT_ID: weatherformoto
  REGION: europe-west1
  SERVICE: weatherformoto
  IMAGE: europe-west1-docker.pkg.dev/weatherformoto/weatherformoto/api
  WIF_PROVIDER: projects/1056457771445/locations/global/workloadIdentityPools/github/providers/github-actions
  DEPLOYER_SA: github-deployer@weatherformoto.iam.gserviceaccount.com

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Build and deploy to Cloud Run
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push the image
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker build --pull -t "${IMAGE}:${GITHUB_SHA}" .
          docker push "${IMAGE}:${GITHUB_SHA}"

      - name: Deploy
        if: ${{ !inputs.run_migrations }}
        run: |
          gcloud run deploy "${SERVICE}" --image "${IMAGE}:${GITHUB_SHA}" \
            --region "${REGION}" --project "${PROJECT_ID}" --quiet

      - name: Deploy with database migrations
        if: ${{ inputs.run_migrations }}
        run: |
          gcloud run deploy "${SERVICE}" --image "${IMAGE}:${GITHUB_SHA}" \
            --region "${REGION}" --project "${PROJECT_ID}" \
            --no-traffic --tag candidate --update-env-vars RUN_DB_MIGRATIONS=true --quiet
          gcloud run services update-traffic "${SERVICE}" --to-latest --remove-tags candidate \
            --region "${REGION}" --project "${PROJECT_ID}" --quiet
          gcloud run services update "${SERVICE}" --remove-env-vars RUN_DB_MIGRATIONS \
            --region "${REGION}" --project "${PROJECT_ID}" --quiet

      - name: Smoke test
        run: |
          url="$(gcloud run services describe "${SERVICE}" --region "${REGION}" --project "${PROJECT_ID}" --format='value(status.url)')"
          curl --fail --silent --show-error --retry 5 --retry-delay 5 "${url}/health"
          curl --fail --silent --show-error --output /dev/null "${url}/meta/scoring"
