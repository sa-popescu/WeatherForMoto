name: GitHub Pages redirect

# The app now lives on https://weatherformoto.bluemouse.cc (Cloudflare).
# GitHub Pages only serves a redirect there, plus a service worker that
# retires the old app's worker for people who installed it from this URL.

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Build redirect site
        run: |
          mkdir -p dist
          cat > dist/index.html <<'EOF'
          <!doctype html>
          <html lang="ro">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>MotoMeteo s-a mutat</title>
            <meta http-equiv="refresh" content="0; url=https://weatherformoto.bluemouse.cc/">
            <link rel="canonical" href="https://weatherformoto.bluemouse.cc/">
            <style>body{font-family:system-ui,sans-serif;background:#0b0c0a;color:#eef1e8;display:grid;place-items:center;min-height:100vh;margin:0;padding:24px;text-align:center}a{color:#b4f03c}</style>
          </head>
          <body>
            <p>MotoMeteo s-a mutat la <a href="https://weatherformoto.bluemouse.cc/">weatherformoto.bluemouse.cc</a>.</p>
          </body>
          </html>
          EOF
          cp dist/index.html dist/404.html
          cat > dist/sw.js <<'EOF'
          // Retire the old app's service worker on this origin and send open windows to the new home.
          const APP_URL = 'https://weatherformoto.bluemouse.cc/';
          self.addEventListener('install', () => self.skipWaiting());
          self.addEventListener('activate', (event) => {
            event.waitUntil((async () => {
              const names = await caches.keys();
              await Promise.all(names.map((name) => caches.delete(name)));
              await self.registration.unregister();
              const windows = await self.clients.matchAll({ type: 'window' });
              windows.forEach((client) => client.navigate(APP_URL));
            })());
          });
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
