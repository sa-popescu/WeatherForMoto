name: Monitor

# Every 30 minutes: does the API answer, and does its database? When one of
# them goes from working to not working, the run fails, so GitHub sends its
# "run failed" email. While it stays down the runs pass quietly (one email per
# outage, not one every half hour), and once it is back, the next outage is
# noticed again. The state between runs is a small file in the Actions cache.
#
# Free: the repository is public, so these minutes cost nothing, and nothing
# here touches the database beyond the one cheap read /health/db makes.

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monitor
  cancel-in-progress: false

env:
  API_URL: https://weatherformoto-1056457771445.europe-west1.run.app

jobs:
  check:
    name: API and database
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Restore the last state
        uses: actions/cache/restore@v6
        with:
          path: monitor-state
          key: monitor-${{ github.run_id }}
          restore-keys: monitor-

      - name: Check
        id: check
        run: |
          set -uo pipefail
          mkdir -p monitor-state

          status() {
            curl --silent --output /dev/null --write-out '%{http_code}' --max-time 20 \
              --retry 2 --retry-delay 15 "$1" || echo 000
          }

          api="$(status "${API_URL}/health")"
          db="$(status "${API_URL}/health/db")"
          # The API remembers the database's answer for a minute, so a second
          # opinion has to wait past that before it means anything.
          if [ "${api}" = "200" ] && [ "${db}" != "200" ]; then
            sleep 70
            db="$(status "${API_URL}/health/db")"
          fi

          prev_api="$(cat monitor-state/api 2>/dev/null || echo up)"
          prev_db="$(cat monitor-state/db 2>/dev/null || echo up)"
          now_api=down; [ "${api}" = "200" ] && now_api=up
          # With the API down, the database cannot be asked: keep what was known.
          now_db="${prev_db}"
          if [ "${now_api}" = "up" ]; then
            now_db=down; [ "${db}" = "200" ] && now_db=up
          fi
          echo "${now_api}" > monitor-state/api
          echo "${now_db}" > monitor-state/db

          {
            echo "### Motonor"
            echo "- API: ${now_api} (HTTP ${api}), before: ${prev_api}"
            echo "- database: ${now_db} (HTTP ${db}), before: ${prev_db}"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "API ${now_api} (HTTP ${api}), database ${now_db} (HTTP ${db})."

          alert=""
          if [ "${prev_api}" = "up" ] && [ "${now_api}" = "down" ]; then
            alert="The Motonor API does not answer (GET /health gave HTTP ${api}). The app falls back to Open-Meteo for the weather; accounts, routes and alerts are down."
          elif [ "${prev_db}" = "up" ] && [ "${now_db}" = "down" ]; then
            alert="The Motonor database does not answer (GET /health/db gave HTTP ${db}). Weather still works; accounts, saved routes, alerts and hazards do not. If it is the Turso quota, it stays blocked until the month turns."
          fi
          [ "${prev_api}" = "down" ] && [ "${now_api}" = "up" ] && echo "The API is back."
          [ "${prev_db}" = "down" ] && [ "${now_db}" = "up" ] && echo "The database is back."
          echo "alert=${alert}" >> "$GITHUB_OUTPUT"

      - name: Keep the state for the next run
        if: always()
        uses: actions/cache/save@v6
        with:
          path: monitor-state
          key: monitor-${{ github.run_id }}

      - name: Alert
        if: steps.check.outputs.alert != ''
        env:
          ALERT: ${{ steps.check.outputs.alert }}
        run: |
          echo "::error::${ALERT}"
          exit 1
